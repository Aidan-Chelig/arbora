[package]
name = "arbora"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
aws-config = { version = "1.11", features = ["behavior-version-latest"] }
aws-credential-types = "1.2"
aws-sdk-s3 = { version = "1.144", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
ignore = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
reflink-copy = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tokio = { version = "1.47", features = ["fs", "io-util", "rt-multi-thread"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
